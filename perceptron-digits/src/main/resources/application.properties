# Digits demo runs on 8082; AND (perceptron-demo) is 8080 and XOR (perceptron-mlp) is 8081
quarkus.http.port=8082
# Random port for tests, so they don't clash with a running dev server
quarkus.http.test-port=0

# Where the MNIST files are kept. They are downloaded there on the first run (~11 MB).
digits.data-dir=data
# Tests don't need (or download) MNIST
%test.digits.load-on-startup=false
